<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar on top, pannable pedigree canvas left, person panel right (bottom sheet on phones).
   Colour: paternal line = blue, maternal line = green; neutrals tinted toward the blue. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202e; --muted:#5b6678; --line:#c9d1dd; --box:#ffffff; --sibbox:#eef1f6;
  --pat:#2f5fb8; --mat:#1f8a6b; --oth:#7b8597; --warn:#c7660a; --cod:#8a2c4a; --doc:#1f8a6b; --fam:#b08400; --unv:#7b8597;
  --focus:#17202e; --shadow:0 1px 2px rgba(23,32,46,.08);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#18202e; --fg:#e6ebf3; --muted:#98a3b6; --line:#2e3a4f; --box:#1c2638; --sibbox:#151d2b;
  --pat:#7fa6f0; --mat:#5cc7a3; --oth:#8d97aa; --warn:#f0a050; --cod:#e58aa8; --doc:#5cc7a3; --fam:#e0b64a; --unv:#8d97aa; --focus:#e6ebf3; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#18202e; --fg:#e6ebf3; --muted:#98a3b6; --line:#2e3a4f; --box:#1c2638; --sibbox:#151d2b;
  --pat:#7fa6f0; --mat:#5cc7a3; --oth:#8d97aa; --warn:#f0a050; --cod:#e58aa8; --doc:#5cc7a3; --fam:#e0b64a; --unv:#8d97aa; --focus:#e6ebf3; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.4;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
header{padding:10px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
h1{font-size:17px;font-weight:600;margin:0 6px 0 0;letter-spacing:.01em}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
button,select,input{font:inherit;color:var(--fg)}
button,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;min-height:32px}
button[aria-pressed="true"],button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible,g[tabindex]:focus-visible{outline:2px solid var(--pat);outline-offset:2px}
#q{border:1px solid var(--line);border-radius:6px;padding:5px 9px;min-height:32px;width:min(230px,60vw);background:var(--bg)}
#sw{position:relative}
#res{position:absolute;top:36px;left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:6px;width:min(340px,86vw);max-height:300px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:7px 10px}
#res small{color:var(--muted);margin-left:6px}
.legend{flex:1 1 100%;min-width:0;display:flex;gap:4px 12px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){main{grid-template-columns:minmax(0,1fr) 340px}}
#stage{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#svg{width:100%;height:100%;display:block}
.zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;padding:0}
#hint{position:absolute;right:10px;bottom:8px;color:var(--muted);font-size:12px;background:var(--bg);padding:2px 6px;border-radius:4px;opacity:.9}
#panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px 16px;min-height:0}
@media(max-width:899px){
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:52vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.2);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateY(105%);transition:transform .18s}
  #panel.show{transform:none}
  #hint{display:none}
}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
#panel h2{font-size:18px;margin:0 0 2px;font-weight:600;overflow-wrap:anywhere}
.yrs{font-family:var(--mono);color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid currentColor;margin:6px 6px 0 0}
.k{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px}
.v{overflow-wrap:anywhere}
.nr{color:var(--muted);font-style:italic}
.row a,.row button.lk{color:var(--pat);background:none;border:0;padding:0;min-height:0;text-decoration:underline;cursor:pointer}
.box2{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px;background:var(--bg)}
.box2.w{border-color:var(--warn)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.close{float:right;display:none}
@media(max-width:899px){.close{display:inline-block}}
.pv{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
/* svg */
.bx rect.b{fill:var(--box);stroke-width:1.5}
.bx.sib rect.b{fill:var(--sibbox)}
.bx.ptn rect.b{fill:var(--sibbox);stroke-dasharray:4 3}
.bx.ghost{opacity:.55}
.bx text{fill:var(--fg);font-size:11.5px;pointer-events:none}
.bx text.y{fill:var(--muted);font-family:var(--mono);font-size:10.5px}
.bx.sel rect.b{stroke:var(--focus)!important;stroke-width:3}
.bx{cursor:pointer}
.ln{fill:none;stroke:var(--line);stroke-width:1.5}
.ln.m{stroke:var(--muted)}
.tg circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.2;cursor:pointer}
.tg text{fill:var(--fg);font-size:12px;text-anchor:middle;pointer-events:none;font-weight:600}
.cb text{fill:#fff;font-size:8.5px;text-anchor:middle;font-weight:600;pointer-events:none}
.mk{pointer-events:none}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Family Tree</h1>
  <div class="ctl" id="sw"><input id="q" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search by name"><div id="res" hidden></div></div>
  <div class="ctl">
    <button id="mAnc" aria-pressed="true">Ancestors</button><button id="mDesc" aria-pressed="false">Descendants</button>
    <label class="ctl" for="sib" style="gap:4px">Siblings <select id="sib"><option value="near">Near (to parents)</option><option value="all">All generations</option><option value="none">Hide</option></select></label>
    <button id="cod" aria-pressed="false">Cause of death</button>
    <button id="home">Chris</button>
  </div>
  <div class="legend" aria-label="Legend">
    <span><i style="background:var(--pat)"></i>Ransford / Galloway side</span>
    <span><i style="background:var(--mat)"></i>Milmo / Barton side</span>
    <span><i style="background:var(--oth)"></i>Other branch</span>
    <span>Badge: <b style="color:var(--doc)">D</b> documented · <b style="color:var(--fam)">F</b> family tradition · <b style="color:var(--unv)">U</b> unverified</span>
    <span><svg width="12" height="11" viewBox="0 0 12 11" aria-hidden="true"><path d="M6 1 11 10H1Z" fill="var(--warn)"/></svg> records disagree</span>
    <span><span style="color:var(--cod);font-weight:600">†</span> deceased (with cause of death on)</span>
  </div>
</header>
<main>
  <div id="stage"><svg id="svg" role="img" aria-label="Family tree"><g id="vp"></g></svg>
    <div class="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zf" aria-label="Fit" style="font-size:11px">Fit</button></div>
    <div id="hint">Drag to pan · scroll or pinch to zoom · click a box for details</div></div>
  <aside id="panel" aria-live="polite"></aside>
</main>
</div>

    if(S.cod&&p.dc)h+='<text class="mk" x="'+(BW-12)+'" y="'+(BH-6)+'" style="fill:'+(p.cod?"var(--cod)":"var(--muted)")+';font-size:14px;font-weight:700">†</text>';
    h+='</g>'});
  out.noPar.forEach(function(q){h+='<text x="'+q.x+'" y="'+(q.y-5)+'" text-anchor="middle" style="fill:var(--muted);font-size:10px">parents not recorded</text>'});
  out.tg.forEach(function(t){var w=t.t.length>2?26:9;h+='<g class="tg" data-t="'+esc(t.id)+'" data-k="'+t.k+'" transform="translate('+t.x+' '+t.y+')" tabindex="0" role="button" aria-label="Expand or collapse"><rect x="'+(-w)+'" y="-9" width="'+(w*2)+'" height="18" rx="9" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.2"/><text y="4">'+esc(t.t)+'</text></g>'});
  vp.innerHTML=h;
  if(!keepView)fit();else apply()}
function apply(){vp.setAttribute("transform","translate("+T.x+" "+T.y+") scale("+T.k+")")}
function bbox(){var b=LAST.boxes,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;b.forEach(function(q){x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x+BW);y1=Math.max(y1,q.y+BH)});return{x0:x0,y0:y0,x1:x1,y1:y1}}
function fit(){var s=$("stage"),W=s.clientWidth,H=s.clientHeight,b=bbox(),w=b.x1-b.x0+60,h=b.y1-b.y0+60,k=Math.min(W/w,H/h,1);
  k=Math.max(k,.55);T.k=k;var bw=(b.x1-b.x0)*k,bh=(b.y1-b.y0)*k;
  T.x=bw<=W?(W-bw)/2-b.x0*k:W/2-(((LAST.boxes.filter(function(q){return q.id===S.focus&&q.cls===""})[0]||LAST.boxes[0]).x+BW/2)*k);
  T.y=bh<=H?(H-bh)/2-b.y0*k:(S.mode==="anc"?H-(b.y1+24)*k:20-b.y0*k);apply()}
function zoomAt(f,cx,cy){var nk=Math.min(2.5,Math.max(.15,T.k*f)),r=nk/T.k;T.x=cx-(cx-T.x)*r;T.y=cy-(cy-T.y)*r;T.k=nk;apply()}
/* pan / zoom / pinch */
var st=$("stage"),ptr={},drag=null,pinch=null,moved=0;
st.addEventListener("pointerdown",function(e){if(e.target.closest("#hint,.zoom"))return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};moved=0;
  var ids=Object.keys(ptr);if(ids.length===1)drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y};
  if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:T.k};drag=null}});
st.addEventListener("pointermove",function(e){if(!ptr[e.pointerId])return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptr);
  if(ids.length===2&&pinch){var a=ptr[ids[0]],b=ptr[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),r=st.getBoundingClientRect();
    zoomAt((pinch.k*d/pinch.d)/T.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);moved=9}
  else if(drag){var dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));if(moved>4){T.x=drag.tx+dx;T.y=drag.ty+dy;apply()}}});
function up(e){delete ptr[e.pointerId];if(Object.keys(ptr).length<2)pinch=null;if(!Object.keys(ptr).length)drag=null}
st.addEventListener("pointerup",up);st.addEventListener("pointercancel",up);
st.addEventListener("wheel",function(e){e.preventDefault();var r=st.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$("zi").onclick=function(){zoomAt(1.25,st.clientWidth/2,st.clientHeight/2)};$("zo").onclick=function(){zoomAt(.8,st.clientWidth/2,st.clientHeight/2)};$("zf").onclick=fit;
function act(g){if(!g)return;if(g.dataset.t){var id=g.dataset.t;if(g.dataset.k==="a"){S.exp[id]=!ancState(id)}else{S.expD[id]=!(S.expD[id]!==undefined?S.expD[id]:descDefault(id))}render(true);return}
  if(g.dataset.id){S.sel=g.dataset.id;showPanel(S.sel);vp.querySelectorAll(".bx").forEach(function(x){x.classList.toggle("sel",x.dataset.id===S.sel)})}}
function ancState(id){var r=null;(function w(n){if(!n||r!==null)return;if(n.id===id&&r===null)r=n.open;w(n.f);w(n.m)})(ROOT());return r===null?false:r}
function ROOT(){return ab(S.focus,0)}
function descDefault(id){return id===S.focus}
vp.addEventListener("click",function(e){if(moved>4)return;act(e.target.closest("g.tg,g.bx"))});
vp.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();act(e.target.closest("g.tg,g.bx"))}});
/* ---------- panel */
function nm(id){return P[id]?'<button class="lk" data-go="'+esc(id)+'">'+esc(P[id].n)+'</button> <span class="yrs">'+esc(yrs(P[id]))+'</span>':'<span class="nr">not recorded</span>'}
function showPanel(id){var p=P[id],h="",cfn=p.cf==="D"?"Documented":p.cf==="F"?"Family tradition":"Unverified",cfc=p.cf==="D"?"var(--doc)":p.cf==="F"?"var(--fam)":"var(--unv)";
  h+='<button class="close" id="pc">Close</button><h2>'+esc(p.n)+'</h2><div class="yrs">'+esc(yrs(p))+'</div>';
  h+='<span class="pill" style="color:'+cfc+'">'+cfn+'</span>';
  if(p.rs)h+='<span class="pill" style="color:var(--muted)">Living or unconfirmed: limited detail</span>';
  else if(p.dc)h+='<span class="pill" style="color:var(--muted)">Deceased</span>';
  h+='<div class="k">Relationship to Chris</div><div class="v">'+esc(p.r)+'</div>';
  if(p.rs){h+='<div class="box2 v" style="margin-top:10px">Living people, and anyone not confirmed as deceased, show only name, relationship and birth year. Dates, places and health are not shown.</div>'}
  else{
    h+='<div class="k">Born</div><div class="v">'+(p.bd?esc(p.bd):p.by?esc(p.by):'<span class="nr">not recorded</span>')+(p.bp?" · "+esc(p.bp):"")+'</div>';
    if(p.dc||p.dy)h+='<div class="k">Died</div><div class="v">'+(p.dd?esc(p.dd):p.dy?esc(p.dy):'<span class="nr">date not recorded</span>')+(p.dp?" · "+esc(p.dp):"")+'</div>';
    else h+='<div class="k">Died</div><div class="v nr">no death recorded</div>'}
  h+='<div class="k">Father</div><div class="v">'+nm(p.f)+'</div><div class="k">Mother</div><div class="v">'+nm(p.m)+'</div>';
  h+='<div class="k">Partner'+((p.pt||[]).length>1?"s":"")+'</div><div class="v">'+((p.pt||[]).length?p.pt.map(nm).join("<br>"):'<span class="nr">not recorded</span>')+'</div>';
  var kc=(KIDS[id]||[]).length;h+='<div class="k">Children</div><div class="v">'+(kc?kc+" recorded":'<span class="nr">none recorded</span>')+'</div>';
  if(p.cx){h+='<div class="k">Conflicting records</div>';p.cx.forEach(function(c){h+='<div class="box2 w"><b>'+esc(c.f)+'</b>'+(c.v.length?': '+c.v.map(function(v){return '<span class="yrs" style="color:var(--fg)">'+esc(v)+'</span>'}).join(' <span class="nr">vs</span> '):'')+'<div style="color:var(--muted);font-size:12.5px;margin-top:3px">'+esc(c.n)+'</div><div style="font-size:12px;margin-top:3px">Issue status: <b>Open</b> (no value chosen)</div></div>'})}
  if(S.cod&&!p.rs){h+='<div class="k">Cause of death</div>';
    if(p.dc){if(p.cod)h+='<div class="box2"><div class="v"><b>'+esc(p.cod.c)+'</b></div><div style="color:var(--muted);font-size:12.5px;margin-top:3px">Source: '+esc(p.cod.s)+'</div><div style="font-size:12.5px;margin-top:3px">Confidence: <b>'+esc(p.cod.cf)+'</b></div></div>';
      else h+='<div class="v nr">not recorded</div>'}
    else h+='<div class="v nr">not applicable (no death recorded)</div>'}
  h+='<div class="k">Source and confidence</div><div class="v">People (CRF-11101) record, from the Family Echo tree exported 27 Jul 2026. Confidence: '+cfn+'.</div>';
  h+='<div class="k">Notion row</div><div class="row v">'+(p.nid?'<a href="https://app.notion.com/42128547'+p.nid+'" target="_blank" rel="noopener">Open in Notion</a>':'<span class="nr">Not linked here. Search People (CRF-11101) for GEDCOM ID @'+esc(p.i)+'@.</span>')+'</div>';
  h+='<div class="acts"><button data-act="focus">Focus on this person</button><button data-act="anc">Ancestors view</button><button data-act="desc">Descendants view</button></div>';
  h+='<div class="pv">Built '+esc(BUILT)+'.</div>';
  var pn=$("panel");pn.innerHTML=h;pn.classList.add("show");pn.scrollTop=0}
function home(){$("panel").innerHTML='<h2>Select a person</h2><div class="v" style="color:var(--muted)">Click any box for dates, places, confidence and records that disagree. Use + and − on a box to open or close that person\'s ancestors (or descendants). Search to jump anywhere in the tree.</div><div class="pv">Living people show only name, relationship and birth year. Missing facts say not recorded; nothing is guessed. Built '+esc(BUILT)+'.</div>'}
$("panel").addEventListener("click",function(e){var t=e.target;if(t.id==="pc"){$("panel").classList.remove("show");return}
  if(t.dataset.go){setFocus(t.dataset.go,S.mode,true);return}
  var a=t.dataset.act;if(a==="focus")setFocus(S.sel,S.mode,true);else if(a==="anc")setFocus(S.sel,"anc",true);else if(a==="desc")setFocus(S.sel,"desc",true)});
function setFocus(id,mode,select){S.focus=id;S.mode=mode;S.exp={};S.expD={};if(select)S.sel=id;modeBtns();render(false);if(select)showPanel(id)}
function modeBtns(){$("mAnc").setAttribute("aria-pressed",S.mode==="anc");$("mDesc").setAttribute("aria-pressed",S.mode==="desc")}
$("mAnc").onclick=function(){setFocus(S.focus,"anc",false)};$("mDesc").onclick=function(){setFocus(S.focus,"desc",false)};
$("home").onclick=function(){setFocus(D.chris,"anc",true)};
$("sib").onchange=function(){S.sib=this.value;render(false)};
$("cod").onclick=function(){S.cod=!S.cod;this.setAttribute("aria-pressed",S.cod);render(true);if(S.sel)showPanel(S.sel)};
/* search */
function norm(s){return s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ"()]/g,"")}
var IDX=D.people.map(function(p){return{i:p.i,n:norm(p.n)}});
$("q").addEventListener("input",function(){var q=norm(this.value.trim()),r=$("res");if(q.length<2){r.hidden=true;return}
  var ws=q.split(/\s+/),m=IDX.filter(function(x){return ws.every(function(w){return x.n.indexOf(w)>-1})}).slice(0,12);
  r.innerHTML=m.length?m.map(function(x){var p=P[x.i];return'<button data-s="'+esc(x.i)+'">'+esc(p.n)+'<small>'+esc(yrs(p))+'</small></button>'}).join(""):'<div style="padding:8px 10px" class="nr">No match</div>';r.hidden=false});
$("res").addEventListener("click",function(e){var b=e.target.closest("button[data-s]");if(!b)return;$("res").hidden=true;$("q").value="";setFocus(b.dataset.s,S.mode,true)});
document.addEventListener("click",function(e){if(!e.target.closest("#sw"))$("res").hidden=true});
window.addEventListener("resize",function(){if(LAST)apply()});
/* boot */
S.sel=D.chris;home();render(false);
})();
</script>
