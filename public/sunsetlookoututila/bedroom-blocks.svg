<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1320" role="img"><title>Sunset Lookout Utila: bedroom LEGO blocks</title><desc>Three reusable gross bedroom footprints with a two-metre-square mattress, clear circulation on both sides and at the foot, private shower toilet basin and storage. Compact 4 by 5.8 metres, standard 4.2 by 6 metres, larger 4.4 by 6.6 metres. Conceptual layouts, not site-selected or code-approved.</desc><rect width="1800" height="1320" fill="#f7f6ef"/><g font-family="Arial,sans-serif" fill="#283b2b"><text x="32" y="36" text-anchor="start" font-size="16" font-weight="400" fill="#283b2b">SUNSET LOOKOUT UTILA / BEDROOM BLOCK LIBRARY</text><text x="32" y="78" text-anchor="start" font-size="33" font-weight="700" fill="#283b2b">A big bed. A small bathroom. Everything else shared.</text><text x="32" y="112" text-anchor="start" font-size="18" font-weight="400" fill="#283b2b">All three keep the same 2.0 × 2.0 m mattress. Green = bedroom; blue = shower room; tan = storage. Drawn to the same scale.</text><text x="55" y="172" text-anchor="start" font-size="24" font-weight="700" fill="#283b2b">B1 / Compact</text><text x="55" y="207" text-anchor="start" font-size="19" font-weight="400" fill="#283b2b">4.0 × 5.8 m outer footprint</text><text x="55" y="239" text-anchor="start" font-size="22" font-weight="700" fill="#283b2b">23.2 m² gross</text><rect x="80" y="285" width="300" height="435" fill="#56624f" stroke="none" stroke-width="1"/><rect x="95" y="300" width="270" height="404.99999999999994" fill="#fffdf6" stroke="none" stroke-width="1"/><rect x="95" y="472.5" width="270" height="232.49999999999994" fill="#d4e5ce" stroke="none" stroke-width="1"/><rect x="95" y="300" width="120" height="165" fill="#d5e5e8" stroke="none" stroke-width="1"/><rect x="95" y="465" width="217.49999999999997" height="7.5" fill="#56624f" stroke="none" stroke-width="1"/><rect x="215" y="300" width="7.5" height="165" fill="#56624f" stroke="none" stroke-width="1"/><rect x="312